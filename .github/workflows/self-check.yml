name: self-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dev dependencies
        run: npm ci --ignore-scripts
      - name: Syntax
        run: npm run check
      - name: Lint
        run: npm run lint
      # The parser fixtures, ledger arithmetic, store and alert tests never touch
      # the network; the render tests only need the bundled fake DOM.
      - name: Unit and render tests
        run: npm test
      # Offline mode mounts both halves and exercises every route, session,
      # normalization and write path with no upstream access, so CI stays
      # deterministic.
      - name: Self-check
        run: npm run verify:offline
      - name: Package contents
        run: npm run pack:check
      - name: README sync
        run: npm run check:readme
