# 提交给 https://github.com/awesome-dsh-plugin/awesome-dsh-plugin 的条目
#
# 用法：把本文件内容存为对方仓库的 data/plugins/mimidor__dsh-stock-dock.yml，
# 然后提一个 PR。README 由对方脚本生成，不要手工改 README。
# 规则：仓库创建满 1 天；url 必须与仓库地址完全一致；description.en 必填。

url: https://github.com/mimidor/dsh-stock-dock
name: mimidor/dsh-stock-dock
category: ui
description:
  en: 'A-share, Hong Kong and US quote strip under the DSH composer: search by code/name/pinyin, watchlist groups with a seeded market group, drag reordering, per-card source dot and mini K-line, intraday 1/3/5 days with volume, 5-60 minute and daily/weekly/monthly charts with MA and volume, three adjust modes, five-level order book, A-share valuation fields, position cost line, trade ledger with realised P/L, price alerts, a plugin settings page, an optional better-sidebar tab, and two agent tools (stock_quote, stock_events). Mini charts are fetched separately and reused via ETag; polling follows each market session and holidays across Tencent, Sina and Eastmoney sources.'
  zh: 'DSH 输入框下方的 A 股 / 港股 / 美股自选股行情条：按代码/名称/拼音搜索、自选分组（含「大盘」预置组）、拖拽排序与悬停删除、每卡数据源与迷你 K 线，分时 1/3/5 日（带成交量）、5–60 分钟与日/周/月 K（均线、成交量、三种复权）、五档盘口、A 股估值字段、持仓成本线、交易流水与已实现盈亏、价格预警、插件设置页、可选 better-sidebar 侧栏页，并注册 stock_quote 与 stock_events 两个 agent 工具；迷你 K 线单独取并用 ETag 复用，按交易时段与节假日调频，腾讯/新浪/东财三源兜底。'
